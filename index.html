  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Geist';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"47ba832c-c866-47d8-a8dc-4a8a0cb79a65\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Digital Team — Color tokens\n   A dark, premium identity: deep navy fields, a single warm coral accent that does all the\n   pointing, and a cool steel as its quieter partner. Text is a near-white \"cloud\" stepping down\n   to \"mist\". Base values first (named exactly as the product code names them), then semantic aliases.\n   color-scheme is dark — this system is dark-first. */\n\n:root {\n  color-scheme: dark;\n\n  /* ---------- Navy field (backgrounds → borders) ---------- */\n  --ink:        #0c1220;  /* deepest background — page floor, insets */\n  --navy:       #121a2e;  /* base background — the canvas */\n  --navy-700:   #19233b;  /* raised panels & cards */\n  --navy-600:   #223049;  /* panel hover / inner borders / step numerals */\n  --slate-line: #2c3a55;  /* hairline borders & dividers */\n\n  /* ---------- Coral — the one accent ---------- */\n  --coral:        #f0653f;  /* primary accent: CTAs, links, key words, icons */\n  --coral-bright: #ff7a52;  /* hover / lifted */\n  --coral-dim:    #c44e2e;  /* pressed / scrollbar thumb */\n\n  /* ---------- Steel — the quiet second ---------- */\n  --steel:     #6f93bd;  /* secondary accent: alternate workers, supporting icons */\n  --steel-dim: #2f4663;  /* steel borders / faint fills */\n\n  /* ---------- Text on dark ---------- */\n  --cloud:    #eef2f8;  /* primary text — headings & emphasis */\n  --mist:     #aab6cc;  /* body / muted text */\n  --mist-dim: #7e8aa3;  /* captions, meta, placeholder */\n  --white:    #ffffff;  /* text on coral */\n\n  /* ---------- Translucent accent washes ---------- */\n  --coral-10:  rgba(240,101,63,0.10); /* icon-chip fill */\n  --coral-15:  rgba(240,101,63,0.15); /* highlighted gradient stop */\n  --coral-25:  rgba(240,101,63,0.25); /* faint number watermark */\n  --coral-40:  rgba(240,101,63,0.40); /* card ring / border */\n  --steel-10:  rgba(111,147,189,0.10);\n  --steel-25:  rgba(111,147,189,0.25);\n  --steel-40:  rgba(111,147,189,0.40);\n\n  /* ================= SEMANTIC ALIASES ================= */\n  /* Surfaces */\n  --surface-page:    var(--navy);      /* app / page canvas */\n  --surface-floor:   var(--ink);       /* deepest band (pricing, footer) */\n  --surface-panel:   var(--navy-700);  /* cards & raised panels */\n  --surface-raised:  var(--navy-600);  /* hover / gradient top */\n  --border-hairline: var(--slate-line);/* default 1px border */\n\n  /* Accents */\n  --accent:        var(--coral);\n  --accent-hover:  var(--coral-bright);\n  --accent-press:  var(--coral-dim);\n  --accent-2:      var(--steel);\n\n  /* Text */\n  --text-strong: var(--cloud);   /* headings, emphasised body */\n  --text-body:   var(--mist);    /* paragraphs */\n  --text-muted:  var(--mist-dim);/* captions, meta, labels */\n  --text-on-accent: var(--white);\n\n  /* Worker accent tokens (coral = highlighted, steel = standard) */\n  --worker-coral: var(--coral);\n  --worker-steel: var(--steel);\n}\n\n/* Digital Team — Typography tokens\n   Two voices in dialogue:\n   · DISPLAY (Fraunces, serif) — every headline, worker name, price & big stat. Warm, optical, human.\n     Always set semibold (600) with tight tracking; the last word of a heading is coloured coral.\n   · UI (Geist, sans) — all body copy, labels, buttons, nav. Calm, neutral, legible.\n   Numbers in stat/price positions use Fraunces too — the brand treats figures as headlines. */\n\n:root {\n  /* ---------- Families ---------- */\n  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif; /* headings, names, prices */\n  --font-sans:    'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif; /* UI & body */\n  --font-mono:    ui-monospace, 'SF Mono', Menlo, monospace; /* rare: code / tokens */\n\n  /* ---------- Weights ---------- */\n  --w-regular:  400;\n  --w-medium:   500;  /* body emphasis, labels, descriptive lines */\n  --w-semibold: 600;  /* the brand's default heading weight */\n  --w-bold:     700;  /* prices, step numerals, logo glyph */\n\n  /* ---------- Display scale (Fraunces) ---------- */\n  --size-hero:      72px; /* hero h1 (scales 48→60→72) */\n  --size-display:   60px; /* section h2 top size */\n  --size-h2:        48px; /* section heading mid */\n  --size-h2-sm:     36px; /* section heading base */\n  --size-descriptive: 30px; /* supporting line under heading (24→30) */\n  --size-price:     48px; /* pricing figure */\n  --size-stat:      36px; /* ROI stat figure */\n  --size-card-title: 24px; /* worker / card name */\n  --size-h3:        20px; /* sub-card title */\n\n  /* ---------- Text scale (Geist) ---------- */\n  --size-lead:  18px;  /* hero sub & section sub (text-lg) */\n  --size-body:  16px;  /* base body */\n  --size-ui:    14px;  /* default UI / card body (text-sm) */\n  --size-label: 12px;  /* eyebrows, pills, uppercase labels (text-xs) */\n  --size-meta:  11px;  /* micro-labels (in-action tag) */\n\n  /* ---------- Tracking ---------- */\n  --track-tight:  -0.02em; /* display headings (tracking-tight) */\n  --track-snug:   -0.01em;\n  --track-wide:    0.05em; /* uppercase labels (tracking-wider) */\n\n  /* ---------- Line heights ---------- */\n  --lh-hero:    1.05;  /* display headings */\n  --lh-snug:    1.2;   /* descriptive lines */\n  --lh-body:    1.6;   /* relaxed body copy */\n  --lh-ui:      1.5;\n\n  /* ================= SEMANTIC TYPE ROLES ================= */\n  --type-hero:        var(--w-semibold) var(--size-hero)/var(--lh-hero) var(--font-display);\n  --type-h2:          var(--w-semibold) var(--size-h2)/var(--lh-hero) var(--font-display);\n  --type-descriptive: var(--w-medium) var(--size-descriptive)/var(--lh-snug) var(--font-sans);\n  --type-card-title:  var(--w-semibold) var(--size-card-title)/1.15 var(--font-display);\n  --type-price:       var(--w-bold) var(--size-price)/1 var(--font-display);\n  --type-lead:        var(--w-regular) var(--size-lead)/var(--lh-body) var(--font-sans);\n  --type-body:        var(--w-regular) var(--size-ui)/var(--lh-body) var(--font-sans);\n  --type-label:       var(--w-medium) var(--size-label)/1 var(--font-sans);\n}\n\n/* Digital Team — Spacing, radius, border, shadow, motion & effect tokens\n   The system is round and soft: pill buttons, 16–24px card radii, generous 96–112px section\n   rhythm. Depth comes from translucent panels over a navy field plus coral \"glow\" shadows —\n   not hard drop shadows. Two signature backdrops (aurora + grid) live here as ready CSS. */\n\n:root {\n  /* ---------- Spacing scale (4px base) ---------- */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;   /* mobile gutter (px-5) */\n  --space-6:  24px;\n  --space-7:  28px;   /* card padding */\n  --space-8:  32px;   /* desktop gutter (px-8) */\n  --space-9:  36px;\n  --space-10: 40px;\n  --space-14: 56px;   /* grid-texture cell / heading→grid gap */\n  --space-16: 64px;\n  --space-24: 96px;   /* section vertical padding (py-24) */\n  --space-28: 112px;  /* section vertical padding (py-28) */\n\n  /* ---------- Radii (the brand is round) ---------- */\n  --radius-sm:   8px;   /* logo glyph, small chips (rounded-lg) */\n  --radius-md:   12px;  /* icon tiles (rounded-xl) */\n  --radius-lg:   16px;  /* standard cards, stats (rounded-2xl) */\n  --radius-xl:   24px;  /* feature / price cards (rounded-3xl) */\n  --radius-pill: 999px; /* buttons, toggles, badges, sliders */\n\n  /* ---------- Borders ---------- */\n  --border-hairline: 1px solid var(--slate-line);   /* default card border */\n  --border-coral:    1px solid var(--coral-40);      /* highlighted card */\n  --border-steel:    1px solid var(--steel-40);      /* steel card */\n  --accent-rule:     2px;  /* left-accent on \"in action\" callouts */\n\n  /* ---------- Shadows & glows (sparing, coral-tinted) ---------- */\n  --shadow-none:    none;\n  --shadow-cta:     0 10px 30px -8px rgba(240,101,63,0.6);    /* coral button rest */\n  --shadow-cta-hi:  0 14px 40px -8px rgba(240,101,63,0.75);   /* coral button hover */\n  --shadow-glow:    0 0 0 1px rgba(240,101,63,0.4), 0 18px 50px -12px rgba(240,101,63,0.35);\n  --shadow-node:    0 0 60px -12px rgba(240,101,63,0.6);      /* hero \"you\" node halo */\n  --shadow-panel:   0 24px 60px -24px rgba(0,0,0,0.7);        /* lifted dark panel */\n  --shadow-price:   0 30px 80px -30px rgba(240,101,63,0.4);   /* highlighted price card */\n  --shadow-logo:    0 6px 16px -6px rgba(240,101,63,0.8);     /* coral logo glyph */\n\n  /* ---------- Layout ---------- */\n  --page-max:   1280px; /* max-w-7xl content width */\n  --reading-max: 672px; /* max-w-2xl heading measure */\n  --nav-h:      64px;\n\n  /* ---------- Motion ---------- */\n  --ease-out:   cubic-bezier(0.22, 1, 0.36, 1); /* signature reveal/flip ease */\n  --ease-std:   cubic-bezier(0.4, 0, 0.2, 1);\n  --dur-fast:   0.15s;  /* hovers */\n  --dur-base:   0.3s;   /* CTAs, nav, colour shifts */\n  --dur-reveal: 0.6s;   /* scroll-in reveals */\n  --dur-flip:   0.65s;  /* card flip */\n  --lift:       translateY(-1px); /* hover lift on buttons/cards (-translate-y-0.5) */\n\n  /* ---------- Signature backdrops (drop onto a positioned layer) ---------- */\n  --bg-aurora:\n    radial-gradient(60% 50% at 15% 0%, rgba(240,101,63,0.16), transparent 60%),\n    radial-gradient(50% 50% at 90% 10%, rgba(111,147,189,0.14), transparent 55%),\n    radial-gradient(70% 60% at 50% 100%, rgba(240,101,63,0.08), transparent 60%);\n  --grid-line: rgba(255,255,255,0.04);  /* grid-texture stroke */\n  --grid-cell: 56px;\n}\n\n<\u002Fstyle>\n  \n  <script src=\"https://cdn.tailwindcss.com\"><\u002Fscript>\n  <script src=\"86eea0e9-9016-48e7-a311-724f9781064c\" integrity=\"sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L\" crossorigin=\"anonymous\"><\u002Fscript>\n  <script src=\"0c402b99-75c3-483b-9a3b-c36291f796d8\" integrity=\"sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm\" crossorigin=\"anonymous\"><\u002Fscript>\n  <script src=\"16328c8d-d4a2-425c-8bd4-f6e2e6c03216\"><\u002Fscript>\n  <style>\n    *, *::before, *::after { box-sizing: border-box; }\n    @keyframes dtFloat {\n      0%, 100% { transform: translate(-50%,-50%) translateY(0) rotate(0deg); }\n      50%       { transform: translate(-50%,-50%) translateY(-14px) rotate(2deg); }\n    }\n    html { scroll-behavior: smooth; }\n    ::selection { background: rgba(240,101,63,0.35); color: #fff; }\n    input[type=range] { -webkit-appearance:none; appearance:none; height:6px; border-radius:999px; outline:none; cursor:pointer; display:block; width:100%; }\n    input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; height:22px; width:22px; border-radius:999px; background:#fff; border:3px solid var(--accent,#f0653f); box-shadow:0 4px 14px -2px rgba(240,101,63,0.7); transition:transform .15s; }\n    input[type=range]::-webkit-slider-thumb:hover { transform:scale(1.15); }\n    input[type=range]::-moz-range-thumb { height:22px; width:22px; border-radius:999px; background:#fff; border:3px solid var(--accent,#f0653f); }\n  <\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div id=\"root\"><\u002Fdiv>\n<script src=\"911e368b-4718-4497-864e-96e35b198433\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
