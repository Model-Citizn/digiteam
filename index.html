<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Team</title>
  <link rel="icon" type="image/png" href="digital-team-icon-512.png">
  <link rel="apple-touch-icon" href="digital-team-icon-512.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/colors.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/spacing.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="tweaks-panel-compiled.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    @keyframes dtFloat {
      0%, 100% { transform: translate(-50%,-50%) translateY(0) rotate(0deg); }
      50%       { transform: translate(-50%,-50%) translateY(-14px) rotate(2deg); }
    }
    html { scroll-behavior: smooth; }
    ::selection { background: rgba(240,101,63,0.35); color: #fff; }
    input[type=range] { -webkit-appearance:none; appearance:none; height:6px; border-radius:999px; outline:none; cursor:pointer; display:block; width:100%; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; height:22px; width:22px; border-radius:999px; background:#fff; border:3px solid var(--accent,#f0653f); box-shadow:0 4px 14px -2px rgba(240,101,63,0.7); transition:transform .15s; }
    input[type=range]::-webkit-slider-thumb:hover { transform:scale(1.15); }
    input[type=range]::-moz-range-thumb { height:22px; width:22px; border-radius:999px; background:#fff; border:3px solid var(--accent,#f0653f); }
  </style>
</head>
<body>
<div id="root"></div>
<script src="app-compiled.js"></script>
<script data-goatcounter="https://lancerubin.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
